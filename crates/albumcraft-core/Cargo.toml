[package]
name = "albumcraft-core"
description = "AlbumCraft without a window: the library, commands, MCP server, picture files, export"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["onnx", "video", "heif", "avif"]
# ONNX Runtime linked in (see crates/albumcraft-ai).
onnx = ["albumcraft-ai/onnx"]
# ONNX Runtime loaded from its library file instead (the Linux packages).
onnx-dynamic = ["onnx", "albumcraft-ai/onnx-dynamic"]
# Videos, read with the FFmpeg libraries (packaging/ffmpeg/build.sh).
video = ["dep:ffmpeg-next"]
# HEIF / HEIC photos, decoded by craft-heif (heif.rs). Their metadata is read without it.
heif = ["craft-heif/decode"]
# AVIF photos, decoded by craft-image-codecs' AV1 decoder (heif.rs).
avif = ["dep:craft-image-codecs", "craft-image-codecs/avif-decode"]

[dependencies]
albumcraft-ai.workspace = true
albumcraft-edit.workspace = true
ab_glyph.workspace = true
fontdb.workspace = true
ffmpeg-next = { workspace = true, optional = true }
chrono.workspace = true
craft-atomic.workspace = true
craft-cms.workspace = true
craft-heif.workspace = true
craft-image-codecs = { workspace = true, optional = true }
craft-metadata.workspace = true
craft-tiff.workspace = true
dirs.workspace = true
epaint_default_fonts.workspace = true
getrandom = "0.4"
image = { workspace = true, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff", "rayon"] }
miniz_oxide.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
jpeg-decoder = "0.3"
# moving rejected pictures to the system trash (freedesktop trash on Linux, Recycle Bin, macOS Trash)
trash = "5.3"

[dev-dependencies]
# synthetic HEIC files for heif.rs's tests
craft-heif = { workspace = true, features = ["test-support"] }

# Simple MAPI for Email (mail.rs): the same windows crate version as the app's printing
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Mapi"] }
