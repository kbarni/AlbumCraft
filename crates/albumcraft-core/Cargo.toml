[package]
name = "albumcraft-core"
description = "AlbumCraft without a window: the library, commands, MCP server, picture files, export"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["onnx"]
# ONNX Runtime linked in (see crates/albumcraft-ai).
onnx = ["albumcraft-ai/onnx"]

[dependencies]
albumcraft-ai.workspace = true
albumcraft-edit.workspace = true
ab_glyph.workspace = true
chrono.workspace = true
dirs.workspace = true
epaint_default_fonts.workspace = true
getrandom = "0.4"
image = { workspace = true, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff", "rayon"] }
kamadak-exif = "0.6.1"
miniz_oxide.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
jpeg-decoder = "0.3"
# moving rejected pictures to the system trash (freedesktop trash on Linux, Recycle Bin, macOS Trash)
trash = "5.3"

# Simple MAPI for Email (mail.rs): the same windows crate version as the app's printing
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Mapi"] }
