[package]
name = "albumcraft-ai"
description = "AlbumCraft's optional AI features: running networks (ONNX Runtime), downloading them, keeping what they found"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["onnx"]
# Links ONNX Runtime into the program. Without it everything else still builds and
# `runtime::available()` answers false.
onnx = ["dep:ort"]
# With `onnx`: ONNX Runtime is not linked in but loaded when first needed from its library file
# (libonnxruntime.so) beside the program or in `../lib/albumcraft` (see `runtime`). The Linux
# packages are built this way with Microsoft's own build of the library, which runs on older
# systems (glibc 2.28) than the prebuilt one of the `ort` crate (glibc 2.38).
onnx-dynamic = ["onnx", "ort?/load-dynamic"]

[dependencies]
craft-atomic.workspace = true
dirs.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
ureq.workspace = true
# the tokenizers of the search networks (CLIP's BPE, SigLIP's SentencePiece), read from their
# tokenizer.json; pure Rust regular expressions, nothing downloaded
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

# ONNX Runtime, linked statically from the prebuilt libraries the `ort` crate downloads when
# building (none exist for Windows with the GNU toolchain: the feature does nothing there).
[target.'cfg(not(all(windows, target_env = "gnu")))'.dependencies]
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "download-binaries", "tls-rustls"] }

[dev-dependencies]
# the real-picture check reads the PNG pictures written by networks/reference_faces.py
image = { workspace = true, features = ["png"] }
