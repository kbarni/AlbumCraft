<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>AlbumCraft</title>
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)" stroke-linejoin="round" stroke-linecap="round">
    <rect width="512" height="512" fill="#d9478a"/>

    <!-- body and head, in profile, looking left -->
    <path d="M560 250
             C 470 225, 400 185, 345 150
             C 300 112, 235 92, 178 106
             C 128 118, 90 146, 80 178
             C 74 200, 90 216, 122 222
             C 172 232, 230 242, 280 266
             C 330 292, 370 340, 392 400
             C 405 440, 410 480, 405 560
             L 560 560 Z"
          fill="#efe9dc" stroke="#111" stroke-width="10"/>

    <!-- dorsal band of spots -->
    <g fill="#111">
      <ellipse cx="300" cy="150" rx="15" ry="11" transform="rotate(28 300 150)"/>
      <ellipse cx="340" cy="183" rx="12" ry="9" transform="rotate(30 340 183)"/>
      <ellipse cx="384" cy="205" rx="17" ry="12" transform="rotate(25 384 205)"/>
      <ellipse cx="430" cy="232" rx="13" ry="10" transform="rotate(20 430 232)"/>
      <ellipse cx="478" cy="252" rx="16" ry="11" transform="rotate(15 478 252)"/>
      <ellipse cx="410" cy="268" rx="9" ry="7"/>
      <ellipse cx="455" cy="292" rx="12" ry="8" transform="rotate(20 455 292)"/>
      <ellipse cx="360" cy="236" rx="8" ry="6"/>
      <ellipse cx="440" cy="340" rx="10" ry="7" transform="rotate(35 440 340)"/>
      <ellipse cx="480" cy="372" rx="14" ry="9" transform="rotate(40 480 372)"/>
      <ellipse cx="450" cy="420" rx="9" ry="7"/>
      <ellipse cx="470" cy="470" rx="13" ry="9" transform="rotate(50 470 470)"/>
      <!-- head spots -->
      <circle cx="250" cy="118" r="7"/>
      <circle cx="272" cy="135" r="5"/>
      <circle cx="226" cy="112" r="5"/>
      <circle cx="150" cy="128" r="4"/>
      <circle cx="132" cy="142" r="3.5"/>
    </g>

    <!-- engraved shading along the throat and belly -->
    <g fill="none" stroke="#111" stroke-width="3.5" opacity="0.8">
      <path d="M236 230 C 238 238, 238 244, 236 250"/>
      <path d="M256 236 C 259 245, 259 252, 256 259"/>
      <path d="M276 244 C 280 254, 280 262, 276 270"/>
      <path d="M296 256 C 301 266, 301 275, 296 283"/>
      <path d="M314 270 C 320 281, 320 291, 315 299"/>
      <path d="M346 306 C 352 318, 352 328, 347 337"/>
      <path d="M360 330 C 366 343, 366 354, 361 363"/>
      <path d="M372 356 C 378 370, 378 381, 373 391"/>
      <path d="M382 386 C 387 400, 387 412, 383 422"/>
    </g>

    <!-- smiling mouth -->
    <path d="M92 198 C 140 210, 200 220, 246 232 C 258 235, 266 230, 268 220" fill="none" stroke="#111" stroke-width="7"/>
    <!-- nostril -->
    <ellipse cx="98" cy="172" rx="5" ry="4" fill="#111"/>

    <!-- eye: big, with a vertical slit pupil -->
    <circle cx="200" cy="160" r="38" fill="#efe9dc" stroke="#111" stroke-width="9"/>
    <circle cx="200" cy="160" r="27" fill="#f2b43c"/>
    <ellipse cx="200" cy="160" rx="6.5" ry="25" fill="#111"/>
    <circle cx="212" cy="147" r="5.5" fill="#efe9dc"/>
    <path d="M160 128 C 178 112, 222 110, 242 128" fill="none" stroke="#111" stroke-width="6"/>

    <!-- front leg with sticky toe pads -->
    <path d="M292 300 C 290 336, 276 362, 252 384 L 272 404 C 302 380, 324 350, 336 318 Z" fill="#efe9dc" stroke="#111" stroke-width="10"/>
    <g fill="none">
      <g stroke="#111" stroke-width="24">
        <path d="M258 394 L 202 380"/><path d="M258 394 L 206 430"/><path d="M258 394 L 246 450"/><path d="M258 394 L 296 440"/>
      </g>
      <g stroke="#efe9dc" stroke-width="12">
        <path d="M258 394 L 202 380"/><path d="M258 394 L 206 430"/><path d="M258 394 L 246 450"/><path d="M258 394 L 296 440"/>
      </g>
    </g>
    <g fill="#efe9dc" stroke="#111" stroke-width="7">
      <circle cx="198" cy="379" r="14"/><circle cx="202" cy="433" r="14"/><circle cx="245" cy="455" r="14"/><circle cx="299" cy="444" r="14"/>
    </g>
    <circle cx="258" cy="394" r="16" fill="#efe9dc"/>
  </g>
</svg>
