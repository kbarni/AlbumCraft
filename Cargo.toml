[workspace]
# The desktop app (this package) and the libraries it is built from; see "Code layout" in CLAUDE.md.
members = [".", "crates/albumcraft-edit", "crates/albumcraft-core", "crates/albumcraft-ai"]
# plain `cargo build` / `cargo test` (as CI runs them) cover every crate
default-members = [".", "crates/albumcraft-edit", "crates/albumcraft-core", "crates/albumcraft-ai"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kbarni/AlbumCraft"

[workspace.dependencies]
albumcraft-ai = { path = "crates/albumcraft-ai", default-features = false }
albumcraft-core = { path = "crates/albumcraft-core", default-features = false }
albumcraft-edit = { path = "crates/albumcraft-edit" }
ab_glyph = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7.0.0"
epaint_default_fonts = "0.37.0"
image = { version = "0.25.10", default-features = false }
miniz_oxide = "0.9"
rayon = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# online maps (only when the user turned them on): HTTPS with rustls, no system TLS library needed
ureq = { version = "3", default-features = false, features = ["rustls"] }

[package]
name = "albumcraft"
description = "A fast, simple photo organizer with a non-destructive editor"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["onnx"]
# ONNX Runtime linked in, to run the networks of the AI features (see crates/albumcraft-ai).
# `cargo build --no-default-features` builds the app without it.
onnx = ["albumcraft-core/onnx"]

[dependencies]
albumcraft-core.workspace = true
chrono.workspace = true
dirs.workspace = true
earcut = "0.4"
eframe = "0.37.0"
epaint_default_fonts.workspace = true
image = { workspace = true, features = ["png"] }
miniz_oxide.workspace = true
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "flac", "vorbis", "wav", "mp4"] }
rfd = "0.17.2"
serde_json.workspace = true
ureq.workspace = true
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.1"
rust-embed = "8.14.0"
fluent-bundle = "0.16.0"

[dev-dependencies]
ab_glyph.workspace = true
# the test that every UI character can be drawn tells real emoji (from the system's emoji font) apart
unicode-properties = { version = "0.1.5", default-features = false, features = ["emoji"] }

# embeds the app icon and version in albumcraft.exe (build.rs)
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs", "Win32_System_Memory"] }

# the X11 fallback when WAYLAND_DISPLAY is stale (src/display.rs); the same winit eframe uses
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["x11"] }

[profile.dev]
opt-level = 1
# Full debug info made a 450 MB program that crashed while starting on this machine.
debug = false
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
