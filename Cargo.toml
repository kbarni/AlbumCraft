[workspace]
# The desktop app (this package) and the libraries it is built from; see "Code layout" in CLAUDE.md.
members = [".", "crates/albumcraft-edit", "crates/albumcraft-core", "crates/albumcraft-ai"]
# plain `cargo build` / `cargo test` (as CI runs them) cover every crate
default-members = [".", "crates/albumcraft-edit", "crates/albumcraft-core", "crates/albumcraft-ai"]
resolver = "3"

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kbarni/AlbumCraft"

[workspace.dependencies]
albumcraft-ai = { path = "crates/albumcraft-ai", default-features = false }
albumcraft-core = { path = "crates/albumcraft-core", default-features = false }
albumcraft-edit = { path = "crates/albumcraft-edit" }
ab_glyph = "0.2"
# the fonts installed on this computer, for the editor's text (crates/albumcraft-core: fonts)
fontdb = "0.23"
# crash-safe saving (flushed temporary file, renamed over the old one, folder synced; retries on
# Windows while an antivirus holds the file), shared with the other Craft apps. Every craft-libs
# crate is pinned to the same rev (craft-update below).
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "30a568b97fa2927d2217f98ba9c799bc76102144" }
# picture metadata (EXIF, IPTC, XMP) and the TIFF structure EXIF is stored in, shared with the
# other Craft apps (crates/albumcraft-core: filemeta, exifinfo, xmp, geo, export). Same rev.
craft-metadata = { git = "https://github.com/storytold/craft-libs", rev = "30a568b97fa2927d2217f98ba9c799bc76102144" }
craft-tiff = { git = "https://github.com/storytold/craft-libs", rev = "30a568b97fa2927d2217f98ba9c799bc76102144" }
# Colour management: pictures turned into sRGB from their ICC profile or HEIF / AVIF colour
# description, exported JPEGs tagged sRGB (crates/albumcraft-core: cms). Same rev.
craft-cms = { git = "https://github.com/storytold/craft-libs", rev = "30a568b97fa2927d2217f98ba9c799bc76102144" }
# HEIF / HEIC photos (iPhone, Mac): craft-heif (heic-rs, pure Rust); its box reader also gives the
# EXIF and XMP of HEIF and AVIF files. AVIF pictures: craft-image-codecs' AV1 decoder (craft-video,
# pure Rust). Same rev (crates/albumcraft-core: heif).
craft-heif = { git = "https://github.com/storytold/craft-libs", rev = "30a568b97fa2927d2217f98ba9c799bc76102144", default-features = false, features = ["metadata"] }
craft-image-codecs = { git = "https://github.com/storytold/craft-libs", rev = "30a568b97fa2927d2217f98ba9c799bc76102144", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7.0.0"
epaint_default_fonts = "0.37.0"
# videos: the FFmpeg libraries of packaging/ffmpeg/build.sh (a playback-only build), found with pkg-config
ffmpeg-next = { version = "9.1", default-features = false, features = ["format", "software-scaling", "software-resampling"] }
image = { version = "0.25.10", default-features = false }
miniz_oxide = "0.9"
rayon = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# online maps (only when the user turned them on): HTTPS with rustls, no system TLS library needed
ureq = { version = "3", default-features = false, features = ["rustls"] }

[package]
name = "albumcraft"
description = "A fast, simple photo organizer with a non-destructive editor"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["onnx", "video", "heif", "avif"]
# ONNX Runtime linked in, to run the networks of the AI features (see crates/albumcraft-ai).
# `cargo build --no-default-features` builds the app without it.
onnx = ["albumcraft-core/onnx"]
# ONNX Runtime loaded from its library file beside the program instead of linked in: what the
# Linux packages are built with (packaging/linux/package.sh puts the file there).
onnx-dynamic = ["onnx", "albumcraft-core/onnx-dynamic"]
# Videos in the library, the editor and slideshows, through the FFmpeg libraries (packaging/ffmpeg/build.sh).
# Without it, video files are left out as before.
video = ["albumcraft-core/video"]
# HEIF / HEIC photos (HEVC: whether to ship the decoder is the distributor's call). Without it, they
# are left out of the library.
heif = ["albumcraft-core/heif"]
# AVIF photos (AV1). Without it, they are left out of the library.
avif = ["albumcraft-core/avif"]

[dependencies]
albumcraft-core.workspace = true
chrono.workspace = true
dirs.workspace = true
earcut = "0.4"
eframe = "0.37.0"
epaint_default_fonts.workspace = true
image = { workspace = true, features = ["png"] }
miniz_oxide.workspace = true
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "flac", "vorbis", "wav", "mp4"] }
# not called directly any more (the pickers go through craft-dialogs, which uses it): kept for its
# default `wayland` feature, so that on Wayland the desktop portal's picker belongs to the window
rfd = "0.17.2"
# draws the colour icons of the Bright style (assets/icons/, src/color_icons.rs)
resvg = { version = "0.45.1", default-features = false }
serde_json.workspace = true
ureq.workspace = true
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.1"
rust-embed = "8.14.0"
fluent-bundle = "0.16.0"
# the check for a newer release at start (and Help > Check for Updates), its prompt and the
# self-update, shared with the other Craft apps (src/updates.rs)
# file and folder pickers that don't block the event loop (on macOS a blocking dialog can make
# winit abort the app), and quitting the macOS way (closing the window can crash in AppKit);
# src/file_dialogs.rs, `App::logic`
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "30a568b97fa2927d2217f98ba9c799bc76102144" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "30a568b97fa2927d2217f98ba9c799bc76102144", features = ["egui"] }
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "30a568b97fa2927d2217f98ba9c799bc76102144", features = ["egui"] }
# printing, shared with the other Craft apps (src/print.rs, src/print_cups.rs). Same craft-libs rev as
# craft-update. Linux / macOS: IPP straight to the CUPS socket (craft-ipp), which also works in the
# Flatpak, where the CUPS programs are missing; craft-print's `lp` path when no socket answers.
# Windows: craft-print (the PDF drawn by Windows.Data.Pdf into the XPS print API, the driver's dialog).
craft-ipp = { git = "https://github.com/storytold/craft-libs", rev = "30a568b97fa2927d2217f98ba9c799bc76102144" }
craft-print = { git = "https://github.com/storytold/craft-libs", rev = "30a568b97fa2927d2217f98ba9c799bc76102144" }

[dev-dependencies]
ab_glyph.workspace = true
# the test that every UI character can be drawn tells real emoji (from the system's emoji font) apart
unicode-properties = { version = "0.1.5", default-features = false, features = ["emoji"] }

# embeds the app icon and version in albumcraft.exe (build.rs)
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

# the X11 fallback when WAYLAND_DISPLAY is stale (src/display.rs); the same winit eframe uses
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["x11"] }

[profile.dev]
opt-level = 1
# Full debug info made a 450 MB program that crashed while starting on this machine.
debug = false
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
