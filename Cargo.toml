[package]
name = "albumcraft"
version = "0.1.0-alpha.1"
edition = "2024"
description = "A fast, simple photo organizer with a non-destructive editor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kbarni/AlbumCraft"
readme = "README.md"

[dependencies]
ab_glyph = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = "0.37.0"
epaint_default_fonts = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff", "rayon"] }
kamadak-exif = "0.6.1"
getrandom = "0.4"
rayon = "1"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "flac", "vorbis", "wav", "mp4"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs", "Win32_System_Memory"] }

[profile.dev]
opt-level = 1
# Full debug info made a 450 MB program that crashed while starting on this machine.
debug = false
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
