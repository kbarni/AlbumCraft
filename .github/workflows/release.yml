name: Release

# Pushing a tag v<version> (matching Cargo.toml) builds every package and publishes a GitHub
# release with them. Tags with a "-" (v0.3.0-rc.1) become pre-releases. Notes come from
# docs/release-notes/<version>.md when it exists.
#
# Run it by hand (Actions > Release > Run workflow) to build every package without releasing:
# they are kept as the run's artifacts.
#
#   Linux x86_64    .AppImage (+ .zsync), .deb, .flatpak, .tar.gz   packaging/linux/
#   Windows x64     .msi, -portable.zip                             packaging/windows/
#   macOS arm64     .app in a .dmg (ad-hoc signed)                  below
#
# File names are <stem>-<version>-<os>-<arch>.<kind>, as craft-update (the update check, see
# src/updates.rs) expects: albumcraft-0.6.0-windows-x64.msi, albumcraft-0.6.0-macos-arm64.dmg.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Version from Cargo.toml (and the tag)
        shell: bash
        run: |
          version=$(. packaging/common.sh && echo "$VERSION")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # Ubuntu 24.04: the prebuilt ONNX Runtime (AI features) needs glibc 2.38 and GCC 13's libstdc++,
    # so the packages run on Ubuntu 24.04, Debian 13 and newer (the Flatpak brings its own runtime).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dependencies and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
            libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev libasound2-dev \
            desktop-file-utils appstream zsync
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: storytold/craft-common-actions/actions/install-nfpm@main
      - name: Build and package (tar.gz, deb, AppImage)
        run: packaging/linux/package.sh
      - name: Check the .deb installs
        run: |
          sudo apt-get install -y ./dist/release/*.deb
          albumcraft --version
          dpkg -L albumcraft | grep -E 'bin/|applications/|metainfo/|256x256'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/release/*
          if-no-files-found: error

  flatpak:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: dist/linux
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          # flatpak-builder runs eu-strip (elfutils), and appstream compose needs the SVG loader.
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils librsvg2-common
          # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the Flatpak bundle
        run: packaging/linux/flatpak-bundle.sh dist/linux/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: dist/release/*.flatpak
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: storytold/craft-common-actions/actions/install-wix@main
        with:
          install-extensions: "true"
      - name: Build and package (msi, zip)
        shell: pwsh
        run: ./packaging/windows/package.ps1
      - name: Check the MSI installs and uninstalls
        shell: pwsh
        run: |
          $msi = (Get-Item dist\release\*.msi).FullName
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 50; throw "install failed ($($p.ExitCode))" }
          $exe = Join-Path $env:ProgramFiles 'AlbumCraft\albumcraft.exe'
          if (-not (Test-Path $exe)) { throw "$exe is missing" }
          $lnk = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\AlbumCraft.lnk'
          if (-not (Test-Path $lnk)) { throw "$lnk is missing" }
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed ($($p.ExitCode))" }
          if (Test-Path $exe) { throw "$exe is still there after uninstalling" }
          Write-Output 'ok: installed, found the exe and the shortcut, uninstalled'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/release/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: cargo build --release --locked
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          app="AlbumCraft.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist/release
          cp target/release/albumcraft "$app/Contents/MacOS/"
          sed "s/@VERSION@/${VERSION}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          iconset=albumcraft.iconset
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/app-icon/albumcraft-1024.png --out "$iconset/icon_${s}x${s}.png" > /dev/null
            d=$((s * 2))
            sips -z $d $d assets/app-icon/albumcraft-1024.png --out "$iconset/icon_${s}x${s}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/albumcraft.icns"
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE "$app/Contents/Resources/"
          # ad-hoc signature (no developer certificate): needed to run on Apple Silicon
          codesign --force --deep --sign - "$app"
          "$app/Contents/MacOS/albumcraft" --version
          # a disk image with the app and a link to Applications, to drag it there; the update
          # check installs AlbumCraft.app from its top level
          dmg_root=dmg-root
          mkdir -p "$dmg_root"
          ditto "$app" "$dmg_root/$app"
          ln -s /Applications "$dmg_root/Applications"
          dmg="dist/release/albumcraft-${VERSION}-macos-arm64.dmg"
          hdiutil create -volname "AlbumCraft ${VERSION}" -srcfolder "$dmg_root" -fs HFS+ -format UDZO -ov "$dmg"
          # check it: mount it and run the app in it
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          "$mnt/$app/Contents/MacOS/albumcraft" --version
          codesign --verify --deep "$mnt/$app"
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/release/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [version, linux, flatpak, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          args=(--title "AlbumCraft ${VERSION}")
          [[ "$VERSION" == *-* ]] && args+=(--prerelease)
          if [ -f "docs/release-notes/${VERSION}.md" ]; then
            args+=(--notes-file "docs/release-notes/${VERSION}.md")
          else
            args+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag "${args[@]}" dist/*
